services:
  app:
    build:
      context: .
      target: dev
    container_name: alfa-leetcode-api-docker
    ports:
      - '3000:3000'
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules

  # Graftcode Gateway - exposes src/services/* as a strongly-typed client for
  # any language. See GRAFTCODE.md. Port 8080 -> gg service calls (container
  # port 80), port 8081 -> Graftcode Vision (container port 81).
  graft:
    build:
      context: .
      target: graft
    container_name: alfa-leetcode-api-graft
    ports:
      - '8080:80'
      - '8081:81'
    restart: 'no'
